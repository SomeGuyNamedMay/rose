[package]
name = "rose"
version = "0.1.0"
edition = "2021"
description = "A basic Wayland compositor built on Smithay"
license-file = "LICENSE"

[dependencies]
fontdb = "0.24.0"
fontdue = "0.9.5"
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.2.1", features = ["preserve_order"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dependencies.smithay]
version = "0.7.0"
default-features = false
features = ["backend_winit", "wayland_frontend", "desktop", "renderer_gl"]

[dev-dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
xkbcommon = "0.8"
