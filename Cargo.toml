[package]
name = "rose"
version = "0.1.0"
edition = "2021"
description = "A basic Wayland compositor built on Smithay"
license-file = "LICENSE"

[dependencies]
egui = { version = "0.37", default-features = false }
egui_glow = { version = "0.37", default-features = false }
fontdb = "0.24.0"
futures-channel = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
percent-encoding = "2.3.2"
rustix = "1.1.6"
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.2.1", features = ["preserve_order"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xcursor = "0.3"
zbus = "6"

[dependencies.smithay]
version = "0.7.0"
default-features = false
features = ["backend_winit", "backend_drm", "backend_gbm", "backend_egl", "backend_libinput", "backend_udev", "backend_session_libseat", "wayland_frontend", "desktop", "renderer_gl"]

[dev-dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
xkbcommon = "0.8"
